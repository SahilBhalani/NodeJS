<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Recommendation</title>

    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />

    <!-- Libraries FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>

  <body>
    <div class="container">
      <br />
      <h1 class="text-center">Movie Recommendation System</h1>

      <div class="form-group">
        <label for="userInput">Enter Your Preferences:</label>
        <textarea class="form-control" id="userInput" rows="3"></textarea>
      </div>

      <button type="button" class="btn btn-primary" id="recommendBtn">
        Get Movie Recommendation
      </button>

      <div id="loader" class="mt-3 text-center" style="display: none">
        <div class="spinner-border text-primary"></div>
      </div>

      <div id="recommendation" class="mt-3"></div>
    </div>

    <!-- Your JS LAST -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const recommendBtn = document.getElementById('recommendBtn');
        const userInput = document.getElementById('userInput');
        const recommendationDiv = document.getElementById('recommendation');
        const loaderDiv = document.getElementById('loader');

        recommendBtn.addEventListener('click', async () => {
          const inputText = userInput.value.trim();

          if (!inputText) {
            alert('Please enter your preference.');
            return;
          }

          loaderDiv.style.display = 'block';
          recommendationDiv.innerHTML = '';

          try {
            const response = await axios.get(`/recommend?input=${encodeURIComponent(inputText)}`);

            recommendationDiv.innerHTML = `
              <h3>Recommended Movies</h3>
              <div class="card p-3 mt-2">
                ${marked.parse(response.data)}
              </div>
            `;
          } catch (error) {
            console.error(error);
            recommendationDiv.innerHTML =
              '<p class="text-danger">Error fetching recommendations</p>';
          } finally {
            loaderDiv.style.display = 'none';
          }
        });
      });
    </script>
  </body>
</html>
