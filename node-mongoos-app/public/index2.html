<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <br><br><br>
    <div class="container">
        <div class="row">
            <div class="col-md-3"></div>
            <div class="col-md-6 main">

                <form action="http://localhost:3000/sign_up" method="post">
                    <h1>Signup Form</h1>

                    <input class="box" type="text" name="name" id="name" placeholder="Name" required> <br>
                    <input class="box" type="email" name="email" id="email" placeholder="E-Mail" required> <br>
                    <input class="box" type="password" name="password" id="password" placeholder="Password" required> <br>
                    <input class="box" type="text" name="phone" id="phone" placeholder="Phone"
                     required> <br>
                    <input type="submit" id="submitDetails" name="submitDetails" value="Submit">
                </form>
            </div>
            <div class="column-gap-md-3"></div>
        </div>
    </div>
</body>
</html>
